<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nudge4Infection EAST Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* 印刷時のスタイル制御 */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-area, #printable-area * {
                visibility: visible;
            }
            #printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                padding: 0;
                margin: 0;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVGアイコン群
        const IconBrain = ({ className="w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/></svg>
        );
        const IconSave = ({ className="w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        );
        const IconUpload = ({ className="w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
        );
        const IconArrowRight = ({ className="w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        );
        const IconPlus = ({ className="w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        );
        const IconX = ({ className="w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        );
        const IconCheck = ({ className="w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        );
        const IconEdit = ({ className="w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
        );
        const IconTrash = ({ className="w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        );
        const IconPrinter = ({ className="w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
        );
        const IconCopy = ({ className="w-4 h-4" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        );
        const IconInfo = ({ className="w-5 h-5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        );

        const PRESETS = [
            "手指衛生遵守率の向上（5 moments）",
            "個人防護具(PPE)の適切着脱・廃棄",
            "環境清拭・高頻度接触面の消毒徹底",
            "尿道・血管カテーテルの早期抜去と管理",
            "耐性菌(MDRO)保菌者への接触予防策遵守",
            "針刺し・切創防止（安全器材・リキャップ禁止）",
            "血液培養2セット採取・抗菌薬適正使用",
            "面会者・患者の手指衛生＆マスク着用"
        ];
        const TARGETS = ["病棟看護師", "医師・研修医", "介護補助者・看護助手", "リハビリ・放射線等のコメディカル", "清掃・施設管理スタッフ", "患者・家族・面会者", "全医療従事者"];
        const LOCATIONS = ["急性期一般病棟", "ICU / HCU（集中治療系）", "回復期・療養病棟", "外来 / 救急外来", "処置室・内視鏡・透析室", "手術室", "病室ベッドサイド & NS"];
        const BOTTLENECKS = [
            "物理的フリクション: 消毒薬や器材が遠い・動線が悪い",
            "認知負荷・忘却: 業務多忙・他の処置に意識が奪われる",
            "手順の複雑さ: マニュアルが長く、直感的に分かりにくい",
            "社会的規範: 周りがやっていない・注意しづらい雰囲気",
            "タイミングの不一致: 行動すべき瞬間に合図がない",
            "フィードバックの欠如: 実施状況や効果が見えていない"
        ];

        const EAST_CONFIG = {
            'E': { id: 'E', title: 'Easy（容易に）', desc: '手間ゼロ化・デフォルト・配置動線', color: 'green' },
            'A': { id: 'A', title: 'Attractive（魅力的に）', desc: 'サリエンス・視認性・ポジティブ演出', color: 'rose' },
            'S': { id: 'S', title: 'Social（社会的に）', desc: 'ピア規範・ロールモデル・宣言', color: 'blue' },
            'T': { id: 'T', title: 'Timely（タイムリーに）', desc: 'トリガー・ハビットスタック・即時化', color: 'amber' }
        };

        const INITIAL_CONTEXT = { preset: "", task: "", targets: [], locations: [], bottlenecks: [] };

        const BadgeCheckbox = ({ label, checked, onChange }) => (
            <label className={`cursor-pointer inline-flex items-center px-3 py-1.5 rounded-full text-sm font-medium border transition-colors duration-200 
                ${checked ? 'bg-teal-600 text-white border-teal-600' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>
                <input type="checkbox" className="hidden" checked={checked} onChange={(e) => onChange(e.target.checked)} />
                {label}
            </label>
        );

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto flex flex-col">
                        <div className="flex justify-between items-center p-5 border-b border-slate-100 sticky top-0 bg-white">
                            <h3 className="text-xl font-bold text-slate-800">{title}</h3>
                            <button onClick={onClose} className="p-1 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition-colors">
                                <IconX />
                            </button>
                        </div>
                        <div className="p-5 flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [step, setStep] = useState(1);
            const [context, setContext] = useState(INITIAL_CONTEXT);
            const [ideas, setIdeas] = useState([]);
            const [isEastInfoOpen, setIsEastInfoOpen] = useState(false);
            const [editingIdea, setEditingIdea] = useState(null); // null if not editing/adding
            const fileInputRef = useRef(null);
            
            // ナッジ倫理チェックリスト
            const [ethics, setEthics] = useState([
                { id: 'transparency', label: '透明性: ナッジの意図や目的（感染防止）がスタッフに開示されている', checked: false },
                { id: 'freedom', label: '自由度（オプトアウト容易性）: 強制や懲戒ではなく自発的選択の余地がある', checked: false },
                { id: 'safety', label: '患者・医療安全最優先: 処置の遅延や臨床的エラーを誘発しない動線である', checked: false }
            ]);

            const toggleArrayItem = (array, item) => 
                array.includes(item) ? array.filter(i => i !== item) : [...array, item];

            const generateMockIdeas = () => {
                const targetTask = context.task || context.preset || "対象課題";
                const newIdeas = [
                    { id: Date.now()+1, category: 'E', title: '配置のデフォルト・ワンアクション化', detail: `${targetTask}を容易にするため、必要な器材や消毒薬を直感的な動線上にセット化して配置し、取り出す手間を極限まで減らす。`, impact: 4, ease: 4 },
                    { id: Date.now()+2, category: 'A', title: '視覚的サリエンスの向上', detail: `${targetTask}を忘れないよう、対象箇所（ボトルやドアなど）に目立つ色のテープやポジティブなメッセージを掲示し、注意を惹く。`, impact: 3, ease: 5 },
                    { id: Date.now()+3, category: 'S', title: '記述的ピア規範の提示', detail: `「当病棟の8割のスタッフが${targetTask}を確実に実施しています」というポジティブな同調圧力を生むポスターを掲示する。`, impact: 4, ease: 3 },
                    { id: Date.now()+4, category: 'T', title: '決断の瞬間のプロンプト', detail: `${targetTask}を行うべきまさにその瞬間（入室時など）に小さな合図を提示し、既存の作業習慣とセットにする（ハビットスタック）。`, impact: 5, ease: 4 },
                ];
                setIdeas(newIdeas);
                setStep(2);
            };

            const saveIdea = (idea) => {
                if (idea.id) {
                    setIdeas(ideas.map(i => i.id === idea.id ? idea : i));
                } else {
                    setIdeas([...ideas, { ...idea, id: Date.now() }]);
                }
                setEditingIdea(null);
            };

            const deleteIdea = (id) => {
                setIdeas(ideas.filter(i => i.id !== id));
                setEditingIdea(null);
            };

            const handleSaveJson = () => {
                const dataStr = JSON.stringify({ context, ideas, ethics }, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Nudge4Infection_Plan_${new Date().getTime()}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const handleLoadJson = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.context) setContext(data.context);
                        if (data.ideas) setIdeas(data.ideas);
                        if (data.ethics) setEthics(data.ethics);
                        setStep(1);
                    } catch (err) {
                        console.error("JSON parse error", err);
                        // UIでエラー表示する仕組みは簡易的に済ませる
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; // Reset
            };

            const renderStep1 = () => (
                <div className="max-w-4xl mx-auto space-y-8 animate-fade-in">
                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                        <h2 className="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                            <span className="bg-teal-100 text-teal-700 w-8 h-8 rounded-full flex items-center justify-center text-sm">1</span>
                            感染対策における対象課題と現場環境の特定
                        </h2>
                        
                        <div className="space-y-6">
                            {/* Preset & Task */}
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-2">定番プリセットから選択</label>
                                <select 
                                    className="w-full p-3 border border-slate-300 rounded-lg bg-slate-50 focus:ring-2 focus:ring-teal-500 outline-none transition-shadow"
                                    value={context.preset}
                                    onChange={(e) => {
                                        setContext({...context, preset: e.target.value, task: e.target.value});
                                    }}
                                >
                                    <option value="">-- 定番テーマから選択 --</option>
                                    {PRESETS.map(p => <option key={p} value={p}>{p}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-2">改善したい具体的な感染対策課題 <span className="text-rose-500">*</span></label>
                                <input 
                                    type="text" 
                                    placeholder="現状の課題・背景・目標値（任意）を自由入力"
                                    className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none transition-shadow"
                                    value={context.task}
                                    onChange={(e) => setContext({...context, task: e.target.value})}
                                />
                            </div>

                            {/* Targets */}
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-2">対象者（職種・グループ）</label>
                                <div className="flex flex-wrap gap-2">
                                    {TARGETS.map(t => (
                                        <BadgeCheckbox 
                                            key={t} label={t} 
                                            checked={context.targets.includes(t)}
                                            onChange={() => setContext({...context, targets: toggleArrayItem(context.targets, t)})}
                                        />
                                    ))}
                                </div>
                            </div>

                            {/* Locations */}
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-2">実施場所・環境</label>
                                <div className="flex flex-wrap gap-2">
                                    {LOCATIONS.map(l => (
                                        <BadgeCheckbox 
                                            key={l} label={l} 
                                            checked={context.locations.includes(l)}
                                            onChange={() => setContext({...context, locations: toggleArrayItem(context.locations, l)})}
                                        />
                                    ))}
                                </div>
                            </div>

                            {/* Bottlenecks */}
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-2">現状の主なボトルネック・阻害要因（複数選択可）</label>
                                <div className="flex flex-col gap-2">
                                    {BOTTLENECKS.map(b => (
                                        <label key={b} className="flex items-start gap-3 p-3 rounded-lg border border-slate-200 cursor-pointer hover:bg-slate-50 transition-colors">
                                            <input 
                                                type="checkbox" 
                                                className="mt-1 w-4 h-4 text-teal-600 rounded focus:ring-teal-500"
                                                checked={context.bottlenecks.includes(b)}
                                                onChange={() => setContext({...context, bottlenecks: toggleArrayItem(context.bottlenecks, b)})}
                                            />
                                            <span className="text-sm text-slate-700">{b}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="mt-8 pt-6 border-t border-slate-100 flex justify-end">
                            <button 
                                onClick={generateMockIdeas}
                                disabled={!context.task.trim()}
                                className="flex items-center gap-2 bg-teal-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-teal-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed shadow-md shadow-teal-200"
                            >
                                EAST視点で改善案を自動生成 <IconArrowRight />
                            </button>
                        </div>
                    </div>

                    {/* EAST Hint Panel */}
                    <div className="bg-blue-50 border border-blue-100 rounded-2xl p-6 shadow-sm">
                        <div className="flex items-start gap-4">
                            <div className="bg-blue-100 text-blue-600 p-2 rounded-full">
                                <IconBrain className="w-6 h-6" />
                            </div>
                            <div>
                                <h3 className="font-bold text-blue-900 mb-2 text-lg">行動科学・EASTフレームワークとは</h3>
                                <p className="text-blue-800 text-sm mb-4 leading-relaxed">
                                    英国行動インサイトチーム(BIT)が提唱する、人の意思決定と行動を促すための4つの実践的原則です。医療現場の感染対策における「知っているのにできない」ギャップを埋めるのに極めて有効です。
                                </p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-white/60 p-3 rounded-lg border border-blue-100/50">
                                        <strong className="text-green-700 block">E: Easy（容易に）</strong>
                                        <span className="text-sm text-slate-600">フリクション低減。手間を極限まで減らし、最も簡単な選択肢にする。</span>
                                    </div>
                                    <div className="bg-white/60 p-3 rounded-lg border border-blue-100/50">
                                        <strong className="text-rose-700 block">A: Attractive（魅力的に）</strong>
                                        <span className="text-sm text-slate-600">サリエンス向上。視覚的に目立たせ、ポジティブなフィードバックを与える。</span>
                                    </div>
                                    <div className="bg-white/60 p-3 rounded-lg border border-blue-100/50">
                                        <strong className="text-blue-700 block">S: Social（社会的に）</strong>
                                        <span className="text-sm text-slate-600">社会的規範。「周りもやっている」を示し、チームの協力を活用する。</span>
                                    </div>
                                    <div className="bg-white/60 p-3 rounded-lg border border-blue-100/50">
                                        <strong className="text-amber-700 block">T: Timely（タイムリーに）</strong>
                                        <span className="text-sm text-slate-600">プロンプト。行動が起きる瞬間に促し、既存の習慣とセットにする。</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderStep2 = () => (
                <div className="animate-fade-in flex flex-col h-full space-y-4">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800 flex items-center gap-2 mb-1">
                                <span className="bg-teal-100 text-teal-700 w-7 h-7 rounded-full flex items-center justify-center text-sm">2</span>
                                EAST改善案の生成・編集
                            </h2>
                            <p className="text-sm text-slate-500">
                                設定中: <span className="font-semibold text-slate-700">{context.task}</span>
                                {context.targets.length > 0 && ` | 対象: ${context.targets.join(', ')}`}
                            </p>
                        </div>
                        <div className="flex gap-3 w-full md:w-auto">
                            <button 
                                onClick={() => setEditingIdea({ category: 'E', title: '', detail: '', impact: 3, ease: 3 })}
                                className="flex-1 md:flex-none flex items-center justify-center gap-2 px-4 py-2 bg-white border-2 border-dashed border-teal-300 text-teal-700 rounded-lg hover:bg-teal-50 hover:border-teal-400 font-medium transition-colors"
                            >
                                <IconPlus /> アイデア追加
                            </button>
                            <button 
                                onClick={() => setStep(3)}
                                className="flex-1 md:flex-none flex items-center justify-center gap-2 px-6 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 font-bold shadow-sm transition-colors"
                            >
                                優先度マトリクスへ <IconArrowRight />
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 flex-1">
                        {Object.values(EAST_CONFIG).map(config => {
                            const categoryIdeas = ideas.filter(i => i.category === config.id);
                            return (

                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">改善施策タイトル <span className="text-rose-500">*</span></label>
                                    <input type="text" className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-teal-500 outline-none" value={editingIdea.title} onChange={e => setEditingIdea({...editingIdea, title: e.target.value})} placeholder="例: ボトルの赤枠明示" />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">具体的な実施内容・ナッジの仕組み</label>
                                    <textarea className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-teal-500 outline-none h-24 resize-none" value={editingIdea.detail} onChange={e => setEditingIdea({...editingIdea, detail: e.target.value})} placeholder="ナッジの仕組みや運用方法を具体的に記載..."></textarea>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">期待される効果 (1:低 ~ 5:高)</label>
                                        <div className="flex items-center gap-2">
                                            <input type="range" min="1" max="5" step="0.5" className="flex-1 accent-teal-600" value={editingIdea.impact} onChange={e => setEditingIdea({...editingIdea, impact: parseFloat(e.target.value)})} />
                                            <span className="w-8 text-center font-bold text-slate-700">{editingIdea.impact}</span>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">実現の容易さ (1:難 ~ 5:易)</label>
                                        <div className="flex items-center gap-2">
                                            <input type="range" min="1" max="5" step="0.5" className="flex-1 accent-teal-600" value={editingIdea.ease} onChange={e => setEditingIdea({...editingIdea, ease: parseFloat(e.target.value)})} />
                                            <span className="w-8 text-center font-bold text-slate-700">{editingIdea.ease}</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center pt-4 border-t border-slate-100 mt-4">
                                    {editingIdea.id ? (
                                        <button onClick={() => deleteIdea(editingIdea.id)} className="text-rose-600 hover:bg-rose-50 p-2 rounded flex items-center gap-1 text-sm font-medium transition-colors"><IconTrash /> 削除</button>
                                    ) : <div></div>}
                                    <div className="flex gap-2">
                                        <button onClick={() => setEditingIdea(null)} className="px-4 py-2 border border-slate-300 text-slate-700 rounded hover:bg-slate-50 transition-colors">キャンセル</button>
                                        <button onClick={() => saveIdea(editingIdea)} disabled={!editingIdea.title.trim()} className="px-4 py-2 bg-teal-600 text-white rounded font-bold hover:bg-teal-700 disabled:opacity-50 transition-colors">保存する</button>
                                    </div>
                                </div>
                            </div>
                        </Modal>
                    )}
                </React.Fragment>
            );

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header - No print */}
                    <header className="bg-teal-700 text-white shadow-md sticky top-0 z-40 no-print">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                            <h1 className="text-xl font-bold flex items-center gap-2">
                                <IconBrain className="w-6 h-6 text-teal-200" />
                                Nudge4Infection <span className="font-normal text-teal-200 hidden md:inline">| EAST Framework</span>
                            </h1>
                            <div className="flex items-center gap-2 text-sm">
                                <button onClick={() => setIsEastInfoOpen(true)} className="flex items-center gap-1 hover:bg-teal-600 px-3 py-1.5 rounded transition-colors">
                                    <IconInfo className="w-4 h-4"/> EASTとは？
                                </button>
                                <div className="w-px h-5 bg-teal-500 mx-1"></div>
                                <button onClick={handleSaveJson} className="flex items-center gap-1 hover:bg-teal-600 px-3 py-1.5 rounded transition-colors" title="状態を保存">
                                    <IconSave className="w-4 h-4"/> 保存
                                </button>
                                <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-1 hover:bg-teal-600 px-3 py-1.5 rounded transition-colors" title="状態を読込">
                                    <IconUpload className="w-4 h-4"/> 読込
                                </button>
                                <input type="file" ref={fileInputRef} className="hidden" accept=".json" onChange={handleLoadJson} />
                            </div>
                        </div>
                    </header>

                    {/* Navigation Steps - No print */}
                    <div className="bg-white border-b border-slate-200 shadow-sm no-print">
                        <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center text-sm font-medium">
                            {[1,2,3,4].map(s => (
                                <React.Fragment key={s}>
                                    <button 
                                        onClick={() => setStep(s)}
                                        className={`flex items-center gap-2 transition-colors ${step === s ? 'text-teal-600 font-bold' : step > s ? 'text-slate-600 hover:text-teal-500' : 'text-slate-400 cursor-not-allowed'}`}
                                        disabled={step < s && s > Math.max(1, step)} // 簡易ガード
                                    >
                                        <span className={`w-6 h-6 flex items-center justify-center rounded-full text-xs ${step === s ? 'bg-teal-600 text-white' : step > s ? 'bg-slate-200 text-slate-700' : 'bg-slate-100 text-slate-400'}`}>
                                            {step > s ? <IconCheck className="w-3 h-3"/> : s}
                                        </span>
                                        <span className="hidden sm:inline">
                                            {s === 1 ? '1 課題設定' : s === 2 ? '2 改善案生成' : s === 3 ? '3 優先度評価' : '4 計画書出力'}
                                        </span>
                                    </button>
                                    {s < 4 && <IconArrowRight className="text-slate-300 w-4 h-4" />}
                                </React.Fragment>
                            ))}
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-6xl mx-auto w-full p-4 sm:p-6 overflow-x-hidden">
                        {step === 1 && renderStep1()}
                        {step === 2 && renderStep2()}
                        {step === 3 && renderStep3()}
                        {step === 4 && renderStep4()}
                    </main>

                    {renderModals()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
